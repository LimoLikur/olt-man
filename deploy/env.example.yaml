# Production secrets, encrypted with sops + age as deploy/env.sops.yaml (SPEC §9). This file is
# the plaintext template: copy, fill in ON THE VPS, encrypt, delete the plaintext (runbook J2).
#   age-keygen -o ~/.config/sops/age/keys.txt          # once, on the VPS
#   sops --encrypt --age <public age key> deploy/env.yaml > deploy/env.sops.yaml && shred -u deploy/env.yaml
#   sops --decrypt --output-type dotenv deploy/env.sops.yaml > .env   # at deploy time, mode 600
# The credential key pair is NOT in here: `pnpm keys:generate` on the VPS writes secrets/.
APP_TIMEZONE: Asia/Jakarta
POSTGRES_USER: olt
POSTGRES_PASSWORD: CHANGE_ME_long_random
POSTGRES_DB: olt
# api and worker log in as this role (member of `app`, no UPDATE/DELETE on audit_log).
APP_DB_USER: olt_app
APP_DB_PASSWORD: CHANGE_ME_long_random
PUBLIC_DOMAIN: olt.example.com
TLS_ISSUER: admin@example.com
APP_ORIGINS: https://olt.example.com
UI_BASE_URL: https://olt.example.com
ADMIN_ALLOWED_CIDRS: 192.168.1.0/24
OLT_TARGET_CIDRS: 172.30.0.0/24,10.20.0.5/32
MOCK_OLT_CIDRS: 172.30.0.0/24
HTTPS_PORT: "443"
HTTP_PORT: "80"
TELEGRAM_BOT_TOKEN: "CHANGE_ME"
TELEGRAM_CHAT_ID: "CHANGE_ME"
# Empty = default admin password DataUtama*26 (packages/db/src/seed.ts); change it after the first login.
SEED_ADMIN_PASSWORD: CHANGE_ME_min_12_chars
SEED_NOC_PASSWORD: CHANGE_ME_min_12_chars
SEED_TEKNISI_PASSWORD: CHANGE_ME_min_12_chars
